name: Publica el mapa a GitHub Pages
on:
  push:
    branches: [main]
    paths: ['Mataro_ciutat_escoles_V*.zip', 'v92_archive_parts/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepara els fitxers del visor
        run: |
          archive=$(find . -maxdepth 1 -name 'Mataro_ciutat_escoles_V*.zip' | sort -V | tail -1)
          if [ -d v92_archive_parts ]; then
            cat v92_archive_parts/part-*.bin > /tmp/Mataro_ciutat_escoles_V92_cronologia_seus_historics_tabalet.zip
            archive=/tmp/Mataro_ciutat_escoles_V92_cronologia_seus_historics_tabalet.zip
          fi
          test -n "$archive"
          unzip -q "$archive" -d _site
          cp "$archive" _site/Mataro_ciutat_escoles_V92_cronologia_seus_historics_tabalet.zip
          test -s _site/index.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
