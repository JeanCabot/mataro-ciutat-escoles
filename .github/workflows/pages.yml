name: Publica el mapa a GitHub Pages
# Gestió mínima d'Actions: si arriben molts pushos seguits només es publica l'últim,
# i l'artefacte de Pages s'esborra al cap d'1 dia (no acumula emmagatzematge).
# Republish after updating the MapTiler API key secret.
on:
  push:
    branches: [main]
    paths: ['assets/**', 'fotos/**', 'logos/**', 'index.html', 'accessibilitat.html', 'introduccio.html', 'cronologia.html', 'mataro-theme.css', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepara els fitxers del visor
        env:
          MAPTILER_API_KEY: ${{ secrets.MAPTILER_API_KEY }}
        run: |
          mkdir -p _site
          cp index.html introduccio.html cronologia.html accessibilitat.html _site/
          cp -R fotos logos _site/
          if [ -d assets ]; then cp -R assets _site/; fi
          cp mataro-theme.css _site/mataro-theme.css
          if [ -n "$MAPTILER_API_KEY" ]; then
            python3 - <<'PYKEY'
          import html
          import os
          from pathlib import Path
          page = Path("_site/index.html")
          content = page.read_text(encoding="utf-8")
          content = content.replace('<meta name="maptiler-api-key" content="">', '<meta name="maptiler-api-key" content="' + html.escape(os.environ["MAPTILER_API_KEY"], quote=True) + '">')
          page.write_text(content, encoding="utf-8")
          PYKEY
          fi
          test -s _site/index.html
          test -s _site/introduccio.html
          test -s _site/cronologia.html
          test -s _site/accessibilitat.html
          test -d _site/fotos
          test -d _site/logos
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          retention-days: 1
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
