name: Publica el mapa a GitHub Pages
on:
  push:
    branches: [main]
    paths: ['Mataro_ciutat_escoles_V*.zip', 'v*_archive_parts/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepara els fitxers del visor
        run: |
          archive=$(find . -maxdepth 1 -name 'Mataro_ciutat_escoles_V*.zip' | sort -V | tail -1)
          parts_dir=$(find . -maxdepth 1 -type d -name 'v*_archive_parts' | sort -V | tail -1)
          if [ -n "$parts_dir" ]; then
            archive_name=$(cat "$parts_dir/ARCHIVE_NAME.txt")
            cat "$parts_dir"/part-*.bin > "/tmp/$archive_name"
            archive="/tmp/$archive_name"
          fi
          test -n "$archive"
          unzip -q "$archive" -d _site
          cp "$archive" "_site/$(basename "$archive")"
          test -s _site/index.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
