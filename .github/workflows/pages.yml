name: Publica el mapa a GitHub Pages
# Republish after updating the MapTiler API key secret.
on:
  push:
    branches: [main]
    paths: ['site_archive_parts/**', 'index.html', 'accessibilitat.html', 'introduccio.html', 'cronologia.html', 'mataro-theme.css', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepara els fitxers del visor
        env:
          MAPTILER_API_KEY: ${{ secrets.MAPTILER_API_KEY }}
        run: |
          parts_dir=site_archive_parts
          archive_name=$(cat "$parts_dir/ARCHIVE_NAME.txt")
          cat "$parts_dir"/part-*.bin > "/tmp/$archive_name"
          archive="/tmp/$archive_name"
          test -s "$archive"
          mkdir -p _site /tmp/site-source
          unzip -q "$archive" -d /tmp/site-source
          cp /tmp/site-source/index.html /tmp/site-source/introduccio.html /tmp/site-source/cronologia.html /tmp/site-source/accessibilitat.html _site/
          if [ -s index.html ]; then cp index.html _site/index.html; fi
          if [ -s accessibilitat.html ]; then cp accessibilitat.html _site/accessibilitat.html; fi
          if [ -s introduccio.html ]; then cp introduccio.html _site/introduccio.html; fi
          if [ -s cronologia.html ]; then cp cronologia.html _site/cronologia.html; fi
          cp -R /tmp/site-source/fotos /tmp/site-source/logos _site/
          cp /tmp/site-source/aprendre-plegades.webp _site/
          cp mataro-theme.css _site/mataro-theme.css
          if [ -n "$MAPTILER_API_KEY" ]; then
            python3 - <<'PYKEY'
          import html
          import os
          from pathlib import Path
          page = Path("_site/index.html")
          content = page.read_text(encoding="utf-8")
          content = content.replace('<meta name="maptiler-api-key" content="">', '<meta name="maptiler-api-key" content="' + html.escape(os.environ["MAPTILER_API_KEY"], quote=True) + '">')
          page.write_text(content, encoding="utf-8")
          PYKEY
          fi
          test -s _site/index.html
          test -d _site/fotos
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
