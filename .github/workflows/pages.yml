name: Publica el mapa a GitHub Pages
on:
  push:
    branches: [main]
    paths: ['Mataro_ciutat_escoles_V*_directori_ampliat.zip', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepara els fitxers del visor
        run: |
          archive=$(find . -maxdepth 1 -name 'Mataro_ciutat_escoles_V*_directori_ampliat.zip' | sort -V | tail -1)
          test -n "$archive"
          unzip -q "$archive" -d _site
          test -s _site/index.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
